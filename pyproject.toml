[project]
name = "c2c"
version = "0.1.0"
description = "C2C — Cancellation to Compensation. A durable agent for airline disruption compensation cases."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # Restate calls its SDK endpoints over HTTP/2 bidirectional streaming, which
    # uvicorn does not serve. This was installed ad hoc during development and
    # missing here, so a clean clone could not start the workflow service.
    "hypercorn>=0.17",
    "restate-sdk>=1.0",
]

[project.optional-dependencies]
api = ["anthropic>=0.40"]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
